<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR YouTube Agent</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            color: #fff; 
        }

        #ar-ui-overlay {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            display: none; 
            pointer-events: none;
        }

        #ar-ui-overlay:xr-overlay { 
            display: block; 
        }
        
        /* Floating Transparent Glassmorphism Button */
        .floating-trigger {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .floating-trigger:active { 
            transform: scale(0.95); 
        }

        /* Sliding AR Screen Tab */
        .browser-tab {
            position: absolute; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            height: 75vh;
            background: rgba(18, 18, 22, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top-left-radius: 24px; 
            border-top-right-radius: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; 
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        .browser-tab.open { 
            transform: translateY(0); 
        }

        .tab-header {
            display: flex; 
            align-items: center; 
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .close-btn { 
            background: none; 
            border: none; 
            color: #fff; 
            font-size: 22px; 
            cursor: pointer; 
        }

        .tab-body { 
            flex: 1; 
            width: 100%; 
            border: none; 
        }
    </style>
</head>
<body>

    <div id="ar-ui-overlay">
        <!-- Floating Glassmorphism Trigger Button -->
        <button class="floating-trigger" id="triggerBtn">🎵 Play Karuppu Song</button>

        <!-- Sliding Screen Tab -->
        <div class="browser-tab" id="browserTab">
            <div class="tab-header">
                <button class="close-btn" id="closeTab">&times;</button>
                <span style="margin-left: 12px; font-size: 13px; color: #aaa;">AR YouTube Player</span>
            </div>
            <iframe id="ytFrame" class="tab-body" src=""></iframe>
        </div>
    </div>

    <!-- A-Frame Scene configured for WebXR AR DOM Overlay -->
    <a-scene webxr="optionalFeatures: [dom-overlay]; overlayElement: #ar-ui-overlay;">
        <a-entity camera position="0 1.6 0"></a-entity>
    </a-scene>

    <script>
        const triggerBtn = document.getElementById('triggerBtn');
        const browserTab = document.getElementById('browserTab');
        const closeTab = document.getElementById('closeTab');
        const ytFrame = document.getElementById('ytFrame');

        triggerBtn.addEventListener('click', async () => {
            triggerBtn.innerText = "Loading...";
            try {
                const response = await fetch('/agent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: 'open youtube and play Karuppu song' })
                });
                
                const data = await response.json();
                
                if (data.success && data.url) {
                    ytFrame.src = data.url;
                    browserTab.classList.add('open');
                }
            } catch (err) {
                console.error("Failed to load stream", err);
            } finally {
                triggerBtn.innerText = "🎵 Play Karuppu Song";
            }
        });

        closeTab.addEventListener('click', () => {
            browserTab.classList.remove('open');
            ytFrame.src = ""; // Stops playback when closed
        });
    </script>
</body>
</html>
